<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aniversário de 1 Aninho do Mathias!</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #eaf6ff 0%, #dceeff 35%, #fef6e7 70%, #fdeef2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .page {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow:
      0 25px 60px rgba(30, 80, 150, 0.18),
      0 8px 20px rgba(30, 80, 150, 0.12);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .invite-img {
    display: block;
    width: 100%;
    height: auto;
  }

  .rsvp-box {
    padding: 22px 24px 28px;
    text-align: center;
    background: linear-gradient(180deg, #ffffff 0%, #f4faff 100%);
  }

  .rsvp-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    color: #ffffff;
    background: linear-gradient(135deg, #25d366, #128c7e);
    padding: 14px 26px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 10px 22px rgba(18, 140, 126, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .rsvp-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(18, 140, 126, 0.45);
    filter: brightness(1.03);
  }

  .rsvp-btn:active { transform: translateY(0); }

  .wa-icon { flex-shrink: 0; }

  @media (max-width: 480px) {
    .card { border-radius: 20px; }
    .rsvp-box { padding: 18px 16px 22px; }
    .rsvp-btn { font-size: 14.5px; padding: 12px 20px; }
  }
</style>
</head>
